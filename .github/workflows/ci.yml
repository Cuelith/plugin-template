name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Controlli e pacchetto
        run: |
          pnpm install --frozen-lockfile
          pnpm prettier --check .
          pnpm check
          pnpm build
